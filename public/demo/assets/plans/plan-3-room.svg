<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Sample three-room plan</title>
  <rect width="400" height="300" fill="#ffffff"/>
  <g fill="#f5f2ed" stroke="#3a4552" stroke-width="4" stroke-linejoin="round">
    <rect x="20" y="20" width="160" height="190"/>
    <rect x="180" y="20" width="100" height="120"/>
    <rect x="280" y="20" width="100" height="120"/>
    <rect x="180" y="140" width="110" height="70"/>
    <rect x="290" y="140" width="50" height="70"/>
    <rect x="340" y="140" width="40" height="70"/>
  </g>
  <rect x="20" y="210" width="360" height="44" fill="#e7eef4" stroke="#3a4552" stroke-width="3"/>
  <g fill="#ffffff">
    <rect x="176" y="155" width="8" height="40"/>
    <rect x="200" y="136" width="34" height="8"/>
    <rect x="300" y="136" width="34" height="8"/>
    <rect x="286" y="160" width="8" height="30"/>
    <rect x="336" y="160" width="8" height="30"/>
    <rect x="60" y="206" width="70" height="8"/>
  </g>
  <g fill="#1d2733" font-size="14" text-anchor="middle">
    <text x="100" y="118">Living / kitchen</text>
    <text x="230" y="84">Bedroom</text>
    <text x="330" y="84">Bedroom</text>
    <text x="235" y="180">Hall</text>
    <text x="315" y="180" font-size="12">Bath</text>
    <text x="360" y="180" font-size="12">WC</text>
    <text x="200" y="237">Loggia</text>
  </g>
  <text x="20" y="284" font-size="12" fill="#6b7682">Sample plan · not to scale</text>
</svg>
